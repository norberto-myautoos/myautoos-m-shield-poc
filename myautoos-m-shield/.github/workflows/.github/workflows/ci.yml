name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: make test CC=${{ matrix.cc }} EXTRA=-Werror
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make coverage
  static-analysis:
    runs-on: ubuntu-latest
    continue-on-error: true      # informativo hasta definir el perfil MISRA acordado
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - run: cppcheck --enable=warning,style,portability --std=c99 --error-exitcode=1 -I core/include -I sim/include core/src sim/src
